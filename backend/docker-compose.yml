services:
  mysql:
    image: mysql:8.4
    container_name: microcart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: microcart
    ports:
      - "3306:3306"
    volumes:
      - microcart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  microcart_mysql_data:
